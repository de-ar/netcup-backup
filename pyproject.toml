[project]
name = "netcup-backup"
version = "0.1.0"
description = "Zero-downtime backup orchestrator for a Netcup RS 2000 G12 — online SCP snapshots plus restic-to-R2 file backups."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "paramiko>=3.5",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
]

[project.scripts]
netcup-backup = "netcup_backup.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcup_backup"]
include = ["src/netcup_backup/bootstrap-agent.sh"]

[tool.hatch.build.targets.wheel.force-include]
"src/netcup_backup/bootstrap-agent.sh" = "netcup_backup/bootstrap-agent.sh"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
